---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: springboot-path-deployment
  labels:
    app: springboot-path
spec:
  replicas: 2
  selector:
    matchLabels:
      app: springboot-path
  template:
    metadata:
      labels:
        app: springboot-path
    spec:
      containers:
      - name: springboot
        image: naresh240/springboot-pathbased:v1
        ports:
        - containerPort: 8080

---
apiVersion: v1
kind: Service
metadata:
  name: springboot-path-service
spec:
  type: NodePort
  selector:
    app: springboot-path
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
      nodePort: 30003
